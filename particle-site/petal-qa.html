<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花瓣微流 · 实际画布验证</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111119;color:#e8e5ed;font:13px/1.7 'Microsoft YaHei',sans-serif}main{max-width:1300px;margin:auto;padding:18px}h1{font-size:22px;margin:0}p{color:#aaa5b6}button,select{font:inherit;background:#292632;color:#eee;border:1px solid #51485e;border-radius:5px;padding:6px 11px;cursor:pointer}button:disabled{opacity:.4}.controls{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}#stage{height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;border:1px solid #39333f;border-radius:5px}#stage canvas{max-width:100%;max-height:100%}#status{color:#eeb7d3;min-height:24px}#live{font:12px/1.6 monospace;min-height:22px;color:#aaa}video{width:100%;max-height:450px;background:#000}video[hidden]{display:none}pre{white-space:pre-wrap;max-height:350px;overflow:auto;font:11px/1.6 monospace;background:#1b1822;padding:12px}a{color:#f1b6d7}#links{display:flex;gap:14px;flex-wrap:wrap}@media(max-width:800px){#stage{height:360px}}</style>
<main><h1>花瓣微流 · 分层渲染与 1080p 验证</h1><p>实际生产引擎和真实彩色 GLB，所有截图来自最终画布。完整验收包含同秒定位、全层淡出、60 秒自动数量、至少 11 秒有效 1080p 录像与播放器定位。请保持页面可见。</p>
<div class="controls"><button id="load">加载并检查花朵</button><button id="run">运行完整验收（约 100 秒）</button><button id="recordOnly">补测1080p录像</button><select id="count" aria-label="验证粒子数量"><option value="180000">180,000 主体点</option><option value="300000">300,000 主体点</option><option value="500000">500,000 主体点</option></select><button id="apply">应用数量</button><button id="save">保存当前 PNG</button></div>
<div id="status" role="status">尚未运行，不预填通过数或性能。</div><div class="controls" id="views"><button data-time="0">完整原形</button><button data-time="8">边缘微流</button><button data-time="13">局部孔洞</button><button data-time="17">卷曲细丝</button><button data-time="20">完全淡出</button><button data-time="27">反向聚合</button><button data-yaw="0">正面</button><button data-yaw="65">斜侧面</button><button data-yaw="100">侧面</button><button data-yaw="180">背面</button><button id="macro">花头近景</button><button id="full">完整构图</button><button id="play">播放 / 暂停</button></div>
<div id="stage"></div><div id="live"></div><video id="video" muted playsinline controls hidden></video><div id="links"></div><details open><summary>本次真实验证数据</summary><pre id="report">尚未运行。</pre></details></main>
<script type="module">
import { ParticleEngine, DEFAULT_PARAMS } from '/src/ParticleEngine.ts';
import { CanvasRecorder } from '/src/CanvasRecorder.ts';
import { loadParticleAsset } from '/src/assets.ts';
import { PETAL_CLIP, PETAL_PARAMS } from '/src/petalPreset.ts';
const $=s=>document.querySelector(s),wait=ms=>new Promise(r=>setTimeout(r,ms));
let e=null,rec=null,asset=null,report=null,timer=null,busy=false,phase='idle',priorRunning=false;
const params={...DEFAULT_PARAMS,...PETAL_PARAMS,autoCount:false,count:180000,resolution:'1080p'};
const publish=()=>$('#report').textContent=JSON.stringify(report,null,2);
const status=s=>$('#status').textContent=s;
function check(name,pass,detail){report.checks.push({name,pass:!!pass,...(detail===undefined?{}:{detail})});publish();if(!pass)throw new Error(name);}
async function post(path,body,type,extra={}){const r=await fetch(path,{method:'POST',headers:{'Content-Type':type,'X-Particle-QA':'1',...extra},body});const v=await r.json();if(!r.ok)throw new Error(v.error||'QA保存失败');return v;}
async function frames(n=3){await Promise.race([new Promise(r=>{const tick=()=>--n<=0?r():requestAnimationFrame(tick);requestAnimationFrame(tick);}),wait(6000).then(()=>{throw new Error('画面等待超时');})]);}
async function snapshot(){await frames();const gl=e.canvas.getContext('webgl2'),data=new Uint8Array(e.canvas.width*e.canvas.height*4);gl.readPixels(0,0,e.canvas.width,e.canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,data);if(gl.getError()!==gl.NO_ERROR)throw new Error('读取最终画布失败');let lit=0,clipped=0,pink=0,yellow=0,sum=0;for(let i=0;i<data.length;i+=4){const r=data[i],g=data[i+1],b=data[i+2];if(Math.max(r,g,b)>5)lit++;if(Math.min(r,g,b)>246)clipped++;if(r>30&&r>g*1.25&&b>g*1.1)pink++;if(r>35&&g>20&&b<g*.7)yellow++;sum+=(r*.2126+g*.7152+b*.0722)/255;}return{hash:[...new Uint8Array(await crypto.subtle.digest('SHA-256',data))].map(x=>x.toString(16).padStart(2,'0')).join(''),width:e.canvas.width,height:e.canvas.height,lit,clipped,pink,yellow,meanLuma:sum/(data.length/4)};}
async function saveFrame(name){const blob=await e.screenshot();return post('/__qa/frame',blob,'image/png',{'X-Particle-Name':name});}
function view(yaw=0){const d=e.camera.position.distanceTo(e.controls.target)||4.2,r=yaw*Math.PI/180;e.controls.enableDamping=false;e.controls.target.set(0,0,0);e.camera.position.set(Math.sin(r)*d,0,Math.cos(r)*d);e.controls.update(0);e.controls.enableDamping=true;e.needsRendering=true;}
async function seek(t){e.seekTimeline(t);await frames();}
function live(){if(!e)return;const s=e.state;$('#live').textContent=`${phase} · ${s.timelineTime.toFixed(2)}s · 主体 ${s.actualCount.toLocaleString()} / 周边 ${s.ambientCount.toLocaleString()} / 细丝 ${s.filamentCount.toLocaleString()} 条 · ${s.fps.toFixed(1)} 渲染FPS · ${s.adaptiveStatus}`;if(busy&&document.hidden)report.hidden=true;if(phase==='auto')report.auto.samples.push({at:performance.now(),time:s.timelineTime,fps:s.fps,count:s.actualCount,ambient:s.ambientCount,filaments:s.filamentCount,reason:s.adaptiveStatus});if(phase==='recording')report.video.renderFPS.push(s.fps);}
async function setup(){if(e)return;report={startedAt:new Date().toISOString(),status:'running',checks:[],frames:{},hidden:false};e=new ParticleEngine($('#stage'),()=>{});const response=await fetch('/examples/petal-model.glb');if(!response.ok)throw new Error('花朵示例GLB加载失败');const blob=await response.blob();asset=await loadParticleAsset(new File([blob],'花瓣微流.glb',{type:'model/gltf-binary'}));e.setRunning(false);e.setAsset(asset);e.setParams(params);e.setTimeline(PETAL_CLIP);e.seekTimeline(0);e.setEffect('erosion');e.fitView('full');e.seekTimeline(0);const gl=e.canvas.getContext('webgl2'),ext=gl.getExtension('WEBGL_debug_renderer_info');report.environment={browser:navigator.userAgent,platform:navigator.platform,cpuThreads:navigator.hardwareConcurrency,memoryEstimateGB:navigator.deviceMemory??null,gpu:gl.getParameter(ext?ext.UNMASKED_RENDERER_WEBGL:gl.RENDERER),output:[e.canvas.width,e.canvas.height],viewport:[innerWidth,innerHeight]};report.asset={count:asset.count,notes:asset.notes,hasOriginalColors:asset.hasOriginalColors,bytes:blob.size};timer=setInterval(live,1000);}
async function staticChecks(){phase='static';status('检查真实花朵原色、分区、立体视角和同秒定位…');await setup();e.setRunning(false);e.setParams(params);e.setTimeline(PETAL_CLIP);e.seekTimeline(0);e.setEffect('erosion');e.fitView('full');view();e.seekTimeline(0);
 check('真实1080p最终画布',e.canvas.width===1920&&e.canvas.height===1080);
 check('完整GLB原色及法线分区进入采样池',asset.kind==='model'&&asset.hasOriginalColors&&asset.count===500000&&asset.normals?.length===asset.count*3&&asset.surface?.length===asset.count*3);
 const regions=new Set();let centre=0;for(let i=0;i<asset.count;i++){regions.add(Math.round(asset.surface[i*3]*100));if(asset.surface[i*3+2]>.8&&asset.surface[i*3+2]<1.2)centre++;}report.asset.regions=regions.size;report.asset.centre=centre;check('花瓣区域及独立立体花蕊采样有效',regions.size>=5&&centre>1000,{regions:regions.size,centre});
 const base=await snapshot();report.frames.front=base;check('正面细密粉色与黄色均存在且不过曝',base.lit>10000&&base.pink>500&&base.yellow>500&&base.clipped/Math.max(1,base.lit)<.15,base);await saveFrame('petal-front-1080');
 for(const [name,yaw]of[['three-quarter',45],['side',100],['back',180]]){view(yaw);const f=await snapshot();report.frames[name]=f;check(name+'保持立体轮廓',f.lit>3000&&f.hash!==base.hash,{lit:f.lit});await saveFrame('petal-'+name+'-1080');}view(0);e.fitView('full');
 for(const t of[8,13,17,20,27]){await seek(t);const f=await snapshot();report.frames['second'+t]=f;await saveFrame('petal-second-'+t);if(t===20)check('黑场消除主体/外围/细丝/泛光',f.lit===0&&f.meanLuma===0,f);else check(t+'秒存在对应运动画面',f.lit>100&&f.hash!==base.hash,{lit:f.lit});}
 await seek(13);const first=await snapshot();await seek(3);await seek(17);await seek(13);const second=await snapshot();check('同秒往返定位完全确定，轨迹不依赖历史',first.hash===second.hash,{first:first.hash,second:second.hash});
 await seek(0);const start=await snapshot();await seek(36);const end=await snapshot();check('循环首尾像素一致，无残留拖尾',start.hash===end.hash,{start:start.hash,end:end.hash});
 const heldClip={duration:36,keyframes:[{id:'held-start',time:0,scale:1,rotation:[0,0,0],progress:0},{id:'held-end',time:36,scale:1,rotation:[0,0,0],progress:0}]};e.setTimeline(heldClip);await seek(1);const a=await snapshot();await seek(2);const b=await snapshot();check('固定主体姿态时外围粒子仍然微动',a.hash!==b.hash&&e.state.progress===0&&e.state.ambientCount>0);e.setParams({ambient:0});await seek(1);const noAmbientA=await snapshot();await seek(2);const noAmbientB=await snapshot();check('关闭外围后固定主体不受时间扰动',noAmbientA.hash===noAmbientB.hash&&e.state.ambientCount===0);e.setParams(params);e.setTimeline(PETAL_CLIP);
 await seek(13);const pausedA=await snapshot(),time=e.state.time;await wait(450);const pausedB=await snapshot();check('暂停冻结全部运动但保留可观察画面',pausedA.hash===pausedB.hash&&e.state.time===time);
 e.setParams({colorMode:'uniform',color:'#ffffff'});const uniformWhite=await snapshot();e.setParams({colorMode:'original'});const originalAgain=await snapshot();check('花瓣微流允许原色和统一色真实切换且恢复',uniformWhite.hash!==pausedB.hash&&originalAgain.hash===pausedB.hash,{white:uniformWhite.hash,original:originalAgain.hash});
 for(const [key,value]of[['curl',0],['trail',0],['sparkle',1],['motionSpeed',2]]){e.setParams({[key]:value});const changed=await snapshot();e.setParams(params);const restored=await snapshot();check(key+'控件真实改变最终画面并可恢复',changed.hash!==restored.hash&&restored.hash===originalAgain.hash,{changed:changed.hash,restored:restored.hash});}
 const noBloomParams={...e.params,glow:0};e.setParams(noBloomParams);const off=await snapshot();e.setParams({glow:.9});const on=await snapshot();check('真实Bloom进入最终画布',off.hash!==on.hash&&on.meanLuma>off.meanLuma,{off:off.meanLuma,on:on.meanLuma});e.setParams(params);
 e.seekTimeline(0);e.fitView('macro');report.frames.macro=await snapshot();await saveFrame('petal-macro-1080');check('近景构图实质改变画面',report.frames.macro.hash!==base.hash);e.fitView('full');
 const names=['radial','noise','vortex','directional','wave','erosion'];report.effects={};for(const name of names){e.setProgress(0);e.setEffect(name);e.setProgress(.58);const f=await snapshot();report.effects[name]=f.hash;check(name+'有效空间画面',f.lit>100);}
 check('六效果各不相同',new Set(Object.values(report.effects)).size===6);e.setProgress(0);e.setEffect('erosion');e.seekTimeline(0);
 report.status='static-passed';publish();status('静态与时间轴检查完成，可操作视角或继续完整验收。');phase='idle';
}
async function performanceChecks(){report.manual=[];for(const count of[180000,300000,500000]){phase='manual';status('实测1080p主体数量 '+count.toLocaleString()+'…');e.setParams({...params,autoCount:false,count});e.seekTimeline(10);e.setTimelinePlaying(true);await wait(2800);const samples=[];for(let i=0;i<3;i++){await wait(1000);samples.push(e.state.fps);}report.manual.push({count,actual:e.state.actualCount,fps:samples,meanFPS:samples.reduce((a,b)=>a+b,0)/samples.length});check(count+'主体数量真实绘制且没有重置时间轴',e.state.actualCount===count&&e.geometry.drawRange.count===count&&e.state.timelineTime>10);}
 e.seekTimeline(0);report.frames.highDensity=await snapshot();await saveFrame('petal-dense-1080');
 phase='auto';report.auto={samples:[],startedAt:performance.now()};status('连续60秒设备适配与完整36秒回环，请保持页面可见…');e.setParams({...params,autoCount:true,count:500000});e.seekTimeline(0);e.setTimelinePlaying(true);await wait(60500);report.auto.seconds=(performance.now()-report.auto.startedAt)/1000;report.auto.meanFPS=report.auto.samples.filter(s=>s.fps>0).reduce((sum,s)=>sum+s.fps,0)/Math.max(1,report.auto.samples.filter(s=>s.fps>0).length);check('自动数量观察至少60秒且真实数量未越上限',report.auto.seconds>=60&&report.auto.samples.length>=55&&report.auto.samples.every(s=>s.count>=1000&&s.count<=500000));check('完整循环与设备适配期间页面保持可见',!report.hidden);phase='idle';e.setRunning(false);}
async function mediaEvent(name,action){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>done(new Error('播放器'+name+'超时')),15000),ok=()=>done(),err=()=>done(new Error('视频播放失败'));function done(error){clearTimeout(timer);$('#video').removeEventListener(name,ok);$('#video').removeEventListener('error',err);error?reject(error):resolve();}$('#video').addEventListener(name,ok,{once:true});$('#video').addEventListener('error',err,{once:true});action();});}
async function until(test,timeout=20000){const begin=performance.now();while(!test()){if(performance.now()-begin>timeout)throw new Error('录像状态等待超时');if(rec?.state.status==='error')throw new Error(rec.state.error);await wait(60);}}
async function recordingCheck(manual=false){status('录制至少11秒有效1080p画面，验证暂停和相机/参数变化…');report.video={renderFPS:[],targetFPS:30,output:[1920,1080]};e.setParams({...params,count:manual?180000:Math.min(180000,e.state.actualCount),autoCount:!manual});e.seekTimeline(7);e.setTimelinePlaying(true);await wait(1500);rec=new CanvasRecorder(e.canvas,s=>{e.setRecordingLocked(['recording','paused','processing'].includes(s.status));e.setCaptureActive(s.status==='recording');},paused=>{if(paused){priorRunning=e.state.running;e.setRunning(false);}else e.setRunning(priorRunning);});rec.setProjectName('Petal_Microflow');const wallStart=performance.now();rec.start('high');check('录制编码器成功开始',rec.state.status==='recording',rec.mimeType);phase='recording';const count=e.state.actualCount;e.setParams({resolution:'720p'});check('录制锁定实际1080p输出',e.canvas.width===1920&&e.params.resolution==='1080p');await wait(3500);rec.pause();phase='recording-pause';const pauseStart=performance.now(),pauseElapsed=rec.state.elapsed,pauseTime=e.state.timelineTime;await wait(1350);check('录制暂停同步冻结动画且不累计录像时间',rec.state.elapsed===pauseElapsed&&e.state.timelineTime===pauseTime);rec.resume();phase='recording';report.video.pauseSeconds=(performance.now()-pauseStart)/1000;await wait(2000);view(12);e.setParams({glow:.45,curl:1.9});await until(()=>rec.state.elapsed>=11.2);rec.stop();phase='processing';await until(()=>rec.state.status==='ready');const r=rec.state.result;report.video={...report.video,duration:r.duration,width:r.width,height:r.height,mimeType:r.mimeType,bytes:r.blob.size,filename:r.filename,captureMode:r.captureMode,requestedFrames:r.requestedFrames,wallSeconds:(performance.now()-wallStart)/1000,fixedCount:count};check('有效录像至少11秒且输出1080p',r.duration>=11&&r.width===1920&&r.height===1080);check('录制暂停时间排除有效时长',report.video.wallSeconds-r.duration>=1.2);const saved=await post('/__qa/video',r.blob,r.blob.type);report.video.saved=saved;$('#video').hidden=false;await mediaEvent('loadedmetadata',()=>{$('#video').src='/__qa/video';$('#video').load();});check('实际编码视频元数据为1080p且可播放', $('#video').videoWidth===1920&&$('#video').videoHeight===1080&&$('#video').duration>10,{mediaDuration:$('#video').duration,width:$('#video').videoWidth,height:$('#video').videoHeight});await mediaEvent('seeked',()=>$('#video').currentTime=5);await $('#video').play();await wait(450);$('#video').pause();report.video.playback={duration:$('#video').duration,afterSeek:$('#video').currentTime};check('实际视频支持定位后播放暂停',$('#video').currentTime>5.1);$('#links').innerHTML='<a href="/__qa/video" download="'+r.filename+'">下载本次真实视频</a>';phase='idle';e.setRunning(false);}
async function guarded(full,recordOnly=false){if(busy)return;busy=true;$('#load').disabled=$('#run').disabled=true;try{if(recordOnly){await setup();await recordingCheck(true);report.status='recording-passed';}else{await staticChecks();if(full){await performanceChecks();await recordingCheck();report.status='passed';}}publish();await post('/__qa/report',JSON.stringify(report),'application/json');status(full?'完整验收完成，结果和视频已保存。':'静态验证完成，1080p截图已保存。');}catch(err){report??={checks:[]};report.status='failed';report.error=String(err.stack||err);publish();status('验证发现问题：'+err.message);await post('/__qa/report',JSON.stringify(report),'application/json').catch(()=>{});}finally{busy=false;$('#load').disabled=$('#run').disabled=false;}}
$('#recordOnly').onclick=()=>guarded(false,true);$('#load').onclick=()=>guarded(false);$('#run').onclick=()=>guarded(true);$('#apply').onclick=()=>{if(e&&!busy)e.setParams({autoCount:false,count:Number($('#count').value)});};$('#save').onclick=async()=>{if(e){const saved=await saveFrame('petal-manual');status('已保存 '+saved.path);}};$('#play').onclick=()=>e?.togglePause();$('#macro').onclick=()=>e?.fitView('macro');$('#full').onclick=()=>e?.fitView('full');document.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{if(!busy)e?.seekTimeline(Number(b.dataset.time));});document.querySelectorAll('[data-yaw]').forEach(b=>b.onclick=()=>{if(e&&!busy)view(Number(b.dataset.yaw));});window.addEventListener('beforeunload',()=>{clearInterval(timer);rec?.destroy();e?.destroy();});
</script></html>
