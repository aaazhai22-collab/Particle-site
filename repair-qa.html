<body><main>
  <h1>图片空间粒子 · 真实渲染与录像验证</h1>
  <p>用透明 PNG 和原参考 JPG 检查平面原形、空间消散、六种效果、暂停和 12 秒关键帧。按默认 60,000 粒子设置录制至少 11 秒有效 720p 画面，中途暂停约 1.5 秒。请保持此页可见。</p>
  <button id="run">运行图片空间与录像验证</button>
  <div id="status" role="status">等待运行，不预填通过结果或帧率。</div>
  <div class="controls" id="view-controls">
    <button data-view="assembled" disabled>图片聚合</button>
    <button data-view="space" disabled>空间消散</button>
    <button data-view="side" disabled>侧面检查 · 深度 1.2</button>
    <button data-view="flat" disabled>侧面对照 · 深度 0</button>
    <button data-view="animation" disabled>播放 12 秒动画</button>
    <button data-view="png" disabled>切换透明 PNG</button>
    <button data-view="jpg" disabled>切换参考 JPG</button>
  </div>
  <div id="stage"></div><div id="live"></div>
  <video id="video" controls playsinline muted preload="metadata" hidden></video>
  <div id="links"></div>
  <p class="note">仅供本地开发。使用一个粒子渲染器，不创建实体模型或截图图库；录制阶段不生成 PNG。真实视频和报告通过现有 /__qa 接口写入 artifacts/browser-test.*。渲染帧率与实际编码帧率分开记录；静止画面采用按需渲染，静止时的低 FPS 不作为失败。</p>
  <details><summary>查看本次原始结果</summary><pre id="report">尚未运行。</pre></details>
</main>
<script type="module">
import { ParticleEngine } from '/src/ParticleEngine.ts';
import { CanvasRecorder } from '/src/CanvasRecorder.ts';
import { loadParticleAsset } from '/src/assets.ts';
import { sampleClip } from '/src/animation.ts';

const $=selector=>document.querySelector(selector);
const ui={run:$('#run'),status:$('#status'),live:$('#live'),stage:$('#stage'),video:$('#video'),links:$('#links'),report:$('#report')};
const buttons=[...document.querySelectorAll('#view-controls button')];
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const frames=(count=2)=>new Promise(resolve=>{const next=()=>--count<=0?resolve():requestAnimationFrame(next);requestAnimationFrame(next);});
const average=values=>values.length?values.reduce((sum,value)=>sum+value,0)/values.length:null;
const near=(left,right,tolerance=1e-7)=>Math.abs(left-right)<=tolerance;
const sameSample=(left,right)=>near(left.scale,right.scale)&&near(left.progress,right.progress)&&left.rotation.every((value,index)=>near(value,right.rotation[index]));
const effectNames=['radial','noise','vortex','directional','wave','erosion'];
const sources=[{id:'png',url:'/examples/color-flower.png',name:'color-flower.png'}, {id:'jpg',url:'/examples/particle-flower-reference.jpg',name:'particle-flower-reference.jpg'}];
const clip={duration:12,keyframes:[
  {id:'start',time:0,scale:1,rotation:[0,0,0],progress:0},
  {id:'hold',time:1.8,scale:1,rotation:[0,0,0],progress:0},
  {id:'flow',time:5,scale:1.05,rotation:[0,8,-4],progress:.64},
  {id:'dispersed',time:6.8,scale:1.08,rotation:[0,12,-6],progress:1},
  {id:'fade-hold',time:7.5,scale:1.08,rotation:[0,12,-6],progress:1},
  {id:'restored',time:10.8,scale:1,rotation:[0,0,0],progress:0},
  {id:'end',time:12,scale:1,rotation:[0,0,0],progress:0},
]};
const baseParams={count:60000,colorMode:'original',size:2,opacity:.95,glow:.4,spread:1.4,turbulence:.18,motionSpeed:.7,depth:1.2,scatter:.65,stagger:.35,erosion:.72,flowScale:1.5,stringiness:1.55,trail:.25,fade:false,direction:'y',autoRotate:false,playbackRate:1};
const defaultDemoParams={...baseParams,depth:1.35,scatter:.8,stagger:.5,fade:true};
let engine=null,recorder=null,latest=null,report=null,busy=false,timer=null,phase='idle',assets={},currentSource='jpg';
let visibilityEvents=[];
const message=text=>{ui.status.textContent=text;};
const publish=()=>{ui.report.textContent=JSON.stringify(report,null,2);};
const stopTimer=()=>{if(timer)clearInterval(timer);timer=null;};
function cleanup(){stopTimer();recorder?.destroy();engine?.setCaptureActive?.(false);engine?.destroy();recorder=null;engine=null;latest=null;assets={};}
window.addEventListener('beforeunload',cleanup);
document.addEventListener('visibilitychange',()=>{if(busy)visibilityEvents.push({at:new Date().toISOString(),hidden:document.hidden,phase});});
async function post(path,body,type){const response=await fetch(path,{method:'POST',headers:{'Content-Type':type,'X-Particle-QA':'1'},body});const data=await response.json();if(!response.ok)throw new Error(data.error||'QA 保存失败');return data;}
function check(name,pass,detail,critical=true){report.checks.push({name,pass:Boolean(pass),detail});if(!pass&&critical)throw new Error(name+'：'+JSON.stringify(detail));}
function setView(degrees){
  const radians=degrees*Math.PI/180,distance=6.2;
  engine.controls.enableDamping=false;engine.camera.position.set(Math.sin(radians)*distance,.08,Math.cos(radians)*distance);engine.controls.target.set(0,0,0);engine.controls.update(0);engine.controls.enableDamping=true;
}
function selectAsset(id){currentSource=id;engine.setRunning(false);engine.setAsset(assets[id]);engine.setParams(baseParams);engine.setTimeline(clip);engine.seekTimeline(0);engine.setEffect('erosion');setView(0);}
async function fingerprint(){
  await frames();
  const gl=engine.canvas.getContext('webgl2');if(!gl)throw new Error('当前画布未提供 WebGL2，无法进行真实像素检查。');
  const width=engine.canvas.width,height=engine.canvas.height,pixels=new Uint8Array(width*height*4);
  gl.readPixels(0,0,width,height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  if(gl.getError()!==gl.NO_ERROR)throw new Error('读取实际渲染像素失败。');
  let lit=0,minX=width,maxX=-1,minY=height,maxY=-1;
  for(let offset=0;offset<pixels.length;offset+=4){if(Math.max(pixels[offset],pixels[offset+1],pixels[offset+2])>3){const point=offset/4,x=point%width,y=Math.floor(point/width);lit++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);}}
  const digest=await crypto.subtle.digest('SHA-256',pixels);
  return {sha256:[...new Uint8Array(digest)].map(value=>value.toString(16).padStart(2,'0')).join(''),litPixels:lit,bounds:lit?{x:minX,y:minY,width:maxX-minX+1,height:maxY-minY+1}:null};
}
function environment(){
  const gl=engine.canvas.getContext('webgl2'),extension=gl?.getExtension('WEBGL_debug_renderer_info');
  return {browser:navigator.userAgent,platform:navigator.platform,cpuThreads:navigator.hardwareConcurrency,deviceMemoryGB:navigator.deviceMemory??null,deviceMemoryNote:'浏览器估计值，不等于已确认的物理内存',viewport:[innerWidth,innerHeight],devicePixelRatio,outputDimensions:[engine.canvas.width,engine.canvas.height],gpu:gl?{renderer:gl.getParameter(extension?extension.UNMASKED_RENDERER_WEBGL:gl.RENDERER),vendor:gl.getParameter(extension?extension.UNMASKED_VENDOR_WEBGL:gl.VENDOR),version:gl.getParameter(gl.VERSION)}:null};
}
async function until(predicate,timeout,label){const started=performance.now();while(!predicate()){if(performance.now()-started>timeout)throw new Error(label+'超时');if(recorder?.state.status==='error')throw new Error(recorder.state.error||'录制失败');await wait(80);}}
function mediaEvent(event,action,timeout=12000){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>done(new Error('播放器等待 '+event+' 超时')),timeout);const success=()=>done();const failure=()=>done(new Error('生成的视频无法播放'));function done(error){clearTimeout(timer);ui.video.removeEventListener(event,success);ui.video.removeEventListener('error',failure);error?reject(error):resolve();}ui.video.addEventListener(event,success,{once:true});ui.video.addEventListener('error',failure,{once:true});try{action();}catch(error){done(error);}});}
function startLive(){
  timer=setInterval(()=>{
    if(!report||!engine)return;
    if(document.hidden)report.hiddenDuringTest=true;
    if(latest?.fps>0&&engine.state.running&&(phase==='editing'||phase==='recording'))report.renderFPS[phase].push({atSeconds:(performance.now()-report.clockStart)/1000,fps:latest.fps});
    const recording=recorder?.state;
    ui.live.textContent=(phase==='recording'?'正在录制':phase==='recording-pause'?'录制暂停':phase==='editing'?'动画性能采样':phase==='processing'?'等待最终编码数据':'验证中')+' · 渲染 '+Math.round(latest?.fps??0)+' FPS'+(recording?' · 有效录像 '+recording.elapsed.toFixed(2)+' 秒':'');
  },1000);
}
async function testImage(source){
  message('检查 '+source.name+'：原形、空间深度与六种效果…');
  selectAsset(source.id);const asset=assets[source.id],original=await fingerprint();
  let maxZ=0;for(let i=2;i<asset.positions.length;i+=3)maxZ=Math.max(maxZ,Math.abs(asset.positions[i]));
  report.images[source.id]={filename:asset.name,poolCount:asset.count,actualCount:engine.state.actualCount,hasOriginalColors:asset.hasOriginalColors,notes:asset.notes,sourceMaximumAbsZ:maxZ,assembled:original};
  check(source.id+'：原始图片采样保持平面 Z=0',maxZ===0&&asset.hasOriginalColors&&original.litPixels>100,report.images[source.id]);
  check(source.id+'：空间参数真实接入',near(engine.params.depth,1.2)&&near(engine.params.scatter,.65)&&near(engine.params.stagger,.35),{depth:engine.params.depth,scatter:engine.params.scatter,stagger:engine.params.stagger});
  engine.setProgress(.55);setView(90);engine.setParams({depth:0});const flat=await fingerprint();engine.setParams({depth:1.2});const spatial=await fingerprint();
  report.images[source.id].sideDepthComparison={progress:.55,flatDepth0:flat,spaceDepth1_2:spatial};
  check(source.id+'：中间状态侧面随空间深度变化',flat.sha256!==spatial.sha256&&spatial.litPixels>100,report.images[source.id].sideDepthComparison);
  setView(0);const hashes={};
  for(const effect of effectNames){
    engine.setProgress(0);engine.setEffect(effect);engine.setProgress(.55);hashes[effect]=await fingerprint();
    engine.setProgress(0);const restored=await fingerprint();
    check(source.id+'：'+effect+' 反向到 0% 准确还原',restored.sha256===original.sha256&&!engine.trails.visible,{baseline:original.sha256,restored:restored.sha256,trailsVisible:engine.trails.visible});
  }
  report.images[source.id].effectMidpoints=hashes;
  check(source.id+'：六种 GPU 中间态各不相同',new Set(Object.values(hashes).map(value=>value.sha256)).size===6,Object.fromEntries(Object.entries(hashes).map(([key,value])=>[key,value.sha256])));
  check(source.id+'：粒子源位置未写入消散位移',asset.positions.every((value,index)=>index%3!==2||value===0),'原位仍为 Z=0；空间位移只发生在 GPU 渲染中');
}
async function testTimeline(){
  selectAsset('jpg');message('检查 12 秒关键帧三种姿态、播放来源和循环边界…');
  const samples=[];
  for(const seconds of [0,5,8.8]){engine.seekTimeline(seconds);const actual=engine.currentSample,expected=sampleClip(clip,seconds),image=await fingerprint();samples.push({seconds,actual,expected,image});check('时间轴 '+seconds+' 秒姿态准确',sameSample(actual,expected),{actual,expected});}
  report.timeline={duration:12,clip,samples};
  check('12 秒关键帧具有三种实际渲染姿态',new Set(samples.map(value=>value.image.sha256)).size===3,samples.map(value=>({seconds:value.seconds,sha256:value.image.sha256})));
  engine.setProgress(.4);check('手动聚散切换到自由播放来源',engine.state.playbackSource==='free',engine.state.playbackSource);
  engine.seekTimeline(11.7);engine.setTimelineLoop(true);engine.setTimelinePlaying(true);const started=performance.now();await wait(750);engine.setRunning(false);
  const wallSeconds=(performance.now()-started)/1000,expectedTime=(11.7+wallSeconds)%12,actualTime=engine.state.timelineTime;
  report.timeline.loop={wallSeconds,expectedTime,actualTime,playbackSource:engine.state.playbackSource};
  check('12 秒循环真实跨过端点继续前进',engine.state.playbackSource==='timeline'&&actualTime>=0&&actualTime<2&&near(actualTime,expectedTime,.25),report.timeline.loop);
  engine.seekTimeline(4);engine.setTimelinePlaying(true);await wait(700);engine.setRunning(false);const before=engine.state,sampleBefore=engine.currentSample,pixelsBefore=await fingerprint();await wait(450);const after=engine.state,sampleAfter=engine.currentSample,pixelsAfter=await fingerprint();
  report.animationPause={timeBefore:before.time,timeAfter:after.time,timelineBefore:before.timelineTime,timelineAfter:after.timelineTime,progressBefore:before.progress,progressAfter:after.progress,samePixels:pixelsBefore.sha256===pixelsAfter.sha256};
  check('动画暂停后时间、姿态与实际像素保持不变',before.time===after.time&&before.timelineTime===after.timelineTime&&before.progress===after.progress&&sameSample(sampleBefore,sampleAfter)&&pixelsBefore.sha256===pixelsAfter.sha256,report.animationPause);
}
async function recordVideo(){
  selectAsset('jpg');engine.setParams(defaultDemoParams);engine.seekTimeline(0);engine.fitView();engine.setTimelinePlaying(true);
  message('正在录制至少 11 秒有效 720p 画面；中途暂停约 1.5 秒…');
  let resolveResult,rejectResult,priorRunning=false;
  const ready=new Promise((resolve,reject)=>{resolveResult=resolve;rejectResult=reject;});
  // Attach a handler immediately, including synchronous capability failures.
  ready.catch(()=>{});
  const watchdog=setTimeout(()=>rejectResult(new Error('等待最终录制数据超时')),35000);
  recorder=new CanvasRecorder(engine.canvas,state=>{
    engine.setCaptureActive(state.status==='recording');
    if(state.status==='ready')resolveResult(state.result);
    if(state.status==='error')rejectResult(new Error(state.error||'实际视频编码失败'));
  },paused=>{if(paused){priorRunning=engine.state.running;engine.setRunning(false);}else engine.setRunning(priorRunning);});
  try{
    if(!recorder.supported)throw new Error('当前浏览器不支持真实画布录制。');
    recorder.setProjectName('Image_Spatial_Repair');phase='recording';const wallStart=performance.now();recorder.start('high');
    check('真实 MediaRecorder 成功开始',recorder.state.status==='recording',{status:recorder.state.status,mimeType:recorder.mimeType});
    await until(()=>recorder.state.elapsed>=5.5,15000,'第一段录像');phase='recording-pause';recorder.pause();
    const pauseStarted=performance.now(),elapsedBefore=recorder.state.elapsed,stateBefore=engine.state,sampleBefore=engine.currentSample;
    await wait(1500);const stateAfter=engine.state,sampleAfter=engine.currentSample;
    report.recordingPause={wallSeconds:(performance.now()-pauseStarted)/1000,elapsedBefore,elapsedAfter:recorder.state.elapsed,status:recorder.state.status,timelineBefore:stateBefore.timelineTime,timelineAfter:stateAfter.timelineTime,motionTimeBefore:stateBefore.time,motionTimeAfter:stateAfter.time};
    check('录制暂停冻结动画且不计入有效时长',recorder.state.status==='paused'&&recorder.state.elapsed===elapsedBefore&&stateBefore.time===stateAfter.time&&stateBefore.timelineTime===stateAfter.timelineTime&&sameSample(sampleBefore,sampleAfter),report.recordingPause);
    recorder.resume();phase='recording';check('继续录制恢复此前动画状态',recorder.state.status==='recording'&&engine.state.running,{recorder:recorder.state.status,running:engine.state.running});
    await until(()=>recorder.state.elapsed>=11.15,16000,'第二段录像');phase='processing';const stopAt=performance.now();recorder.stop();const result=await ready;
    engine.setRunning(false);engine.setCaptureActive(false);
    report.recording={effectiveDurationSeconds:result.duration,wallDurationSeconds:(stopAt-wallStart)/1000,finalizationSeconds:(performance.now()-stopAt)/1000,outputDimensions:[result.width,result.height],encoderFormat:result.mimeType,extension:result.extension,bytes:result.blob.size,filename:result.filename,targetFPS:30,videoEncodingFPS:null,videoEncodingFPSNote:'待解析真实视频容器样本；此处不使用渲染 FPS 代替编码 FPS',requestedBitrate:12000000,audio:false,source:currentSource,params:engine.params,cameraPosition:engine.camera.position.toArray()};
    check('有效录像至少 11 秒并排除暂停',result.duration>=11&&report.recording.wallDurationSeconds-result.duration>=1.45&&near(report.recording.wallDurationSeconds-result.duration,report.recordingPause.wallSeconds,.3),report.recording);
    check('实际录像输出为 1280 × 720',result.width===1280&&result.height===720,report.recording.outputDimensions);
    return result;
  }finally{clearTimeout(watchdog);engine?.setCaptureActive(false);}
}
async function testVideo(result){
  phase='player';message('保存原始视频并检查元数据、定位、播放与暂停…');
  report.recording.saved=await post('/__qa/video',result.blob,result.mimeType);ui.video.hidden=false;
  await mediaEvent('loadedmetadata',()=>{ui.video.src='/__qa/video?repair='+Date.now();ui.video.load();});
  report.player={duration:ui.video.duration,width:ui.video.videoWidth,height:ui.video.videoHeight};
  check('保存视频可读取真实尺寸',ui.video.videoWidth===1280&&ui.video.videoHeight===720,report.player);
  const target=(Number.isFinite(ui.video.duration)?ui.video.duration:result.duration)/2;
  await mediaEvent('seeked',()=>{ui.video.currentTime=target;});report.player.seekTime=ui.video.currentTime;
  check('保存视频可定位到中段',near(ui.video.currentTime,target,.3)&&ui.video.currentTime>4,report.player);
  try{const before=ui.video.currentTime;await ui.video.play();await wait(400);ui.video.pause();report.player.playback={before,after:ui.video.currentTime,paused:ui.video.paused};check('保存视频可播放和暂停',ui.video.currentTime>before&&ui.video.paused,report.player.playback,false);}catch(error){report.player.playbackError=error.message;check('保存视频可播放和暂停',false,'浏览器拒绝自动播放，请使用下方原生播放器人工复核：'+error.message,false);}
  check('视频容器有效时长不包含录制暂停',Number.isFinite(ui.video.duration)&&near(ui.video.duration,result.duration,.5),{mediaDuration:ui.video.duration,effectiveDuration:result.duration},false);
  const link=document.createElement('a');link.href=result.url;link.download=result.filename;link.textContent='下载本次真实录像';ui.links.append(link);
  const reportLink=document.createElement('a');reportLink.href='/__qa/report';reportLink.target='_blank';reportLink.textContent='打开本次 JSON 报告';ui.links.append(reportLink);
}
buttons.forEach(button=>button.addEventListener('click',()=>{
  if(busy||!engine)return;const view=button.dataset.view;
  if(view==='png'||view==='jpg'){selectAsset(view);message('已切换 '+assets[view].name+'，可继续检查聚合与空间消散。');return;}
  engine.setRunning(false);engine.setParams({fade:false,depth:view==='flat'?0:1.2});
  if(view==='assembled'){engine.seekTimeline(0);setView(0);}
  if(view==='space'){engine.seekTimeline(0);engine.setProgress(.55);setView(35);}
  if(view==='side'||view==='flat'){engine.seekTimeline(0);engine.setProgress(.55);setView(90);}
  if(view==='animation'){engine.setParams({fade:true});engine.setTimeline(clip);engine.seekTimeline(0);engine.setEffect('erosion');setView(0);engine.setTimelineLoop(true);engine.setTimelinePlaying(true);}
  message('当前 '+assets[currentSource].name+' · '+button.textContent+'。可用鼠标旋转、缩放和平移。');
}));
ui.run.addEventListener('click',async()=>{
  if(busy||!import.meta.env.DEV)return;busy=true;ui.run.disabled=true;buttons.forEach(button=>button.disabled=true);cleanup();ui.links.replaceChildren();ui.video.pause();ui.video.hidden=true;ui.video.removeAttribute('src');ui.video.load();visibilityEvents=[];phase='setup';
  report={test:'image-spatial-timeline-repair',startedAt:new Date().toISOString(),timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone,clockStart:performance.now(),checks:[],images:{},renderFPS:{editing:[],recording:[]},hiddenDuringTest:document.hidden,notes:['真实文件导入、GPU 渲染和 MediaRecorder 编码。','像素检查读取真实 WebGL framebuffer，录像阶段不读像素、不生成 PNG，只每秒更新小状态。','聚合图片是平面；GPU 消散具有独立深度、散射和错峰参数，不宣称单张图片已自动重建为完整模型。','仅在活动动画及实际录制阶段采样渲染 FPS，静态按需渲染不要求持续 30 FPS。','本次为短时专项检查，未替代 5 分钟稳定性与 5 次重复录像验收。']};
  try{
    message('读取透明花朵 PNG 和原参考 JPG…');
    for(const source of sources){const response=await fetch(source.url);if(!response.ok)throw new Error('示例图片读取失败：'+source.name);assets[source.id]=await loadParticleAsset(new File([await response.blob()],source.name));}
    engine=new ParticleEngine(ui.stage,state=>{latest=state;},error=>{report.renderError=error;message('图形设备错误：'+error);});engine.setRunning(false);
    check('Engine 支持录制连续帧标记',typeof engine.setCaptureActive==='function','录制期间使用 setCaptureActive，静止编辑按需渲染');
    report.environment=environment();report.configuration={spatialTestParams:baseParams,defaultDemoParams,output:'1280x720',targetVideoFPS:30,editingSampleSeconds:4,clip};
    startLive();for(const source of sources)await testImage(source);await testTimeline();
    selectAsset('jpg');engine.setParams(defaultDemoParams);engine.fitView();engine.setTimelineLoop(true);engine.setTimelinePlaying(true);report.configuration.actualEditingParams=engine.params;report.configuration.editingCameraPosition=engine.camera.position.toArray();await wait(1200);phase='editing';message('默认 60,000 粒子活动动画运行中，采样约 4 秒编辑渲染帧率…');await wait(4100);phase='checks';engine.setRunning(false);
    const result=await recordVideo();stopTimer();await testVideo(result);
    report.renderFPS.editingAverage=average(report.renderFPS.editing.map(sample=>sample.fps));report.renderFPS.recordingAverage=average(report.renderFPS.recording.map(sample=>sample.fps));
    check('活动编辑平均渲染达到 30 FPS 初始目标',report.renderFPS.editingAverage>=30,{average:report.renderFPS.editingAverage,samples:report.renderFPS.editing.length},false);
    check('活动录像平均渲染达到 30 FPS 初始目标',report.renderFPS.recordingAverage>=30,{average:report.renderFPS.recordingAverage,samples:report.renderFPS.recording.length},false);
    check('图形设备未报告渲染错误',!report.renderError,report.renderError??null,false);
    report.visibilityEvents=visibilityEvents;check('专项测试期间页面保持可见',!report.hiddenDuringTest&&!visibilityEvents.some(event=>event.hidden),visibilityEvents,false);
    report.completedAt=new Date().toISOString();report.success=report.checks.every(item=>item.pass);delete report.clockStart;
    await post('/__qa/report',JSON.stringify(report),'application/json');publish();selectAsset('jpg');ui.live.textContent='原始视频与结果已保存；下方可查看实际数据。';message(report.success?'专项验证通过。可查看录像，或用上方按钮检查图片的空间变化。':'检查完成，部分项目未通过。请展开原始结果查看真实原因。');
  }catch(error){
    report.error=error instanceof Error?error.message:String(error);report.failedAt=new Date().toISOString();report.success=false;report.visibilityEvents=visibilityEvents;delete report.clockStart;stopTimer();engine?.setRunning(false);engine?.setCaptureActive?.(false);recorder?.clear();message('验证未完成：'+report.error);publish();await post('/__qa/report',JSON.stringify(report),'application/json').catch(()=>{});
  }finally{phase='idle';busy=false;ui.run.disabled=false;ui.run.textContent='重新运行图片空间与录像验证';buttons.forEach(button=>button.disabled=!engine||!assets.png||!assets.jpg);}
});
if(!import.meta.env.DEV){ui.run.disabled=true;message('此页面仅供本地 Vite 开发验证。');}
