<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>花瓣末段 · 窄范围验收</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111119;color:#e8e5ed;font:13px/1.7 'Microsoft YaHei',sans-serif}main{max-width:1300px;margin:auto;padding:18px}h1{font-size:22px;margin:0}p{color:#aaa5b6}button{font:inherit;background:#292632;color:#eee;border:1px solid #51485e;border-radius:5px;padding:7px 11px;cursor:pointer}button:disabled{opacity:.4}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#stage{height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000;border:1px solid #39333f}#stage canvas{max-width:100%;max-height:100%}#status{color:#eeb7d3;min-height:26px}#live{font:12px monospace;color:#aaa;min-height:22px}pre{white-space:pre-wrap;max-height:400px;overflow:auto;background:#1b1822;padding:12px;font:11px/1.6 monospace}video{width:100%;max-height:450px;background:#000}video[hidden]{display:none}a{color:#f1b6d7}</style>
<main><h1>花瓣末段 · 保持前段画面的窄范围验收</h1><p>固定 180,000 主体点、1080p、现有预设和 36 秒时间轴。旧版与新版顺序使用同一预览区域，每次销毁旧引擎；不运行长时间自动数量测试。静态与录像分别启动。</p>
<div class="controls"><button id="static">运行静态旧新对比</button><button id="record">录制末段与反向（约 12 秒）</button><button id="stop">停止录像</button><button id="save">保存当前 PNG</button></div>
<div id="status" role="status">尚未运行，不预填结果。</div><div id="stage"></div><div id="live"></div>
<div class="controls"><button data-progress="0">原形</button><button data-progress="0.65">保持边界</button><button data-progress="0.85">碎点</button><button data-progress="0.97">临近淡出</button><button data-progress="1">全黑</button></div>
<video id="video" muted playsinline controls hidden></video><div id="links"></div><pre id="report">尚未运行。</pre></main>
<script type="module">
import { ParticleEngine, DEFAULT_PARAMS } from '/src/ParticleEngine.ts';
import { ParticleEngine as BaselineEngine } from '/artifacts/ending-baseline.js';
import { CanvasRecorder } from '/src/CanvasRecorder.ts';
import { loadParticleAsset } from '/src/assets.ts';
import { PETAL_PARAMS, PETAL_CLIP } from '/src/petalPreset.ts';
const $=selector=>document.querySelector(selector),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const PARAMS={...DEFAULT_PARAMS,...PETAL_PARAMS,autoCount:false,count:180000,resolution:'1080p'};
const EARLY=[0,.2,.45,.65],LATE=[.75,.85,.92,.97,1],EFFECTS=['radial','noise','vortex','directional','wave','erosion'];
let engine=null,recorder=null,asset=null,camera=null,busy=false,report=null,phase='idle',priorRunning=false,shaderErrors=[];
const status=message=>$('#status').textContent=message;
const publish=()=>$('#report').textContent=JSON.stringify(report,null,2);
function check(name,passed,detail){report.checks.push({name,passed:!!passed,...(detail===undefined?{}:{detail})});publish();}
async function post(path,body,type,extra={}){const response=await fetch(path,{method:'POST',headers:{'Content-Type':type,'X-Particle-QA':'1',...extra},body});const saved=await response.json();if(!response.ok)throw Error(saved.error||'QA保存失败');return saved;}
async function frames(n=3){await Promise.race([new Promise(resolve=>{const tick=()=>--n<=0?resolve():requestAnimationFrame(tick);requestAnimationFrame(tick);}),wait(7000).then(()=>{throw Error('等待实际画布帧超时');})]);}
async function loadAsset(){if(asset)return asset;const response=await fetch('/examples/petal-model.glb');if(!response.ok)throw Error('花朵GLB加载失败');const blob=await response.blob();asset=await loadParticleAsset(new File([blob],'花瓣微流.glb',{type:'model/gltf-binary'}));return asset;}
function dispose(){recorder?.destroy();recorder=null;engine?.destroy();engine=null;}
function fixedPose(){engine.controls.autoRotate=false;engine.controls.enableDamping=false;if(camera){engine.camera.position.fromArray(camera.position);engine.controls.target.fromArray(camera.target);engine.controls.update(0);}else camera={position:engine.camera.position.toArray(),target:engine.controls.target.toArray()};engine.needsRendering=true;}
async function makeEngine(Class=ParticleEngine){dispose();shaderErrors=[];engine=new Class($('#stage'),()=>{},message=>shaderErrors.push(message));engine.setRunning(false);engine.setAsset(await loadAsset());engine.setParams(PARAMS);engine.setTimeline(PETAL_CLIP);engine.seekTimeline(0);engine.setEffect('erosion');engine.fitView('full');fixedPose();engine.seekTimeline(13);engine.setProgress(0);await frames();engine.render();if(shaderErrors.length)throw Error(shaderErrors.join('; '));return engine;}
function rgbaStats(data,width,height){let lit=0,nonblack=0,pink=0,yellow=0,max=0,sum=0;for(let i=0;i<data.length;i+=4){const r=data[i],g=data[i+1],b=data[i+2],peak=Math.max(r,g,b);if(peak>5)lit++;if(peak>0)nonblack++;max=Math.max(max,peak);if(r>30&&r>g*1.25&&b>g*1.1)pink++;if(r>35&&g>20&&b<g*.7)yellow++;sum+=(r*.2126+g*.7152+b*.0722)/255;}return{width,height,lit,nonblack,pink,yellow,maxRGB:max,meanLuma:sum/(width*height)};}
async function snapshot(keep=false){await frames(2);engine.render();const gl=engine.canvas.getContext('webgl2'),data=new Uint8Array(engine.canvas.width*engine.canvas.height*4);gl.readPixels(0,0,engine.canvas.width,engine.canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,data);if(gl.getError()!==gl.NO_ERROR)throw Error('读取最终画布失败');const hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',data))].map(value=>value.toString(16).padStart(2,'0')).join('');return{summary:{hash,...rgbaStats(data,engine.canvas.width,engine.canvas.height)},...(keep?{data}:{})};}
function difference(a,b){let changedChannels=0,maxDelta=0,totalDelta=0;for(let i=0;i<a.length;i++){const d=Math.abs(a[i]-b[i]);if(d)changedChannels++;maxDelta=Math.max(maxDelta,d);totalDelta+=d;}return{changedChannels,maxDelta,meanAbsoluteDelta:totalDelta/a.length};}
async function progress(p){engine.seekTimeline(13);engine.setProgress(p);await frames(2);}
async function saveFrame(name){return post('/__qa/frame',await engine.screenshot(),'image/png',{'X-Particle-Name':name});}
function environment(){const gl=engine.canvas.getContext('webgl2'),ext=gl.getExtension('WEBGL_debug_renderer_info');return{browser:navigator.userAgent,platform:navigator.platform,cpuThreads:navigator.hardwareConcurrency,memoryEstimateGB:navigator.deviceMemory??null,gpu:gl.getParameter(ext?ext.UNMASKED_RENDERER_WEBGL:gl.RENDERER),output:[engine.canvas.width,engine.canvas.height],viewport:[innerWidth,innerHeight]};}
async function effectSamples(){const hashes={};engine.setParams({...PARAMS,petalFlow:false});for(const effect of EFFECTS){engine.setProgress(0);engine.setEffect(effect);engine.seekTimeline(13);engine.setProgress(.84);hashes[effect]=(await snapshot()).summary;}return hashes;}
async function staticChecks(){
  report={startedAt:new Date().toISOString(),type:'ending-static',status:'running',checks:[],fixed:{count:180000,resolution:'1080p',poseTime:13,params:PARAMS,clip:PETAL_CLIP},early:{},late:{},mainOnly:{},hidden:false};phase='baseline';status('读取旧版最终画布，锁定相机、运动时刻和参数…');camera=null;
  await makeEngine(BaselineEngine);report.environment=environment();report.asset={name:asset.name,count:asset.count,kind:asset.kind,hasOriginalColors:asset.hasOriginalColors};report.fixed.camera=camera;
  const baselineEarly={};for(const p of EARLY){await progress(p);baselineEarly[p]=await snapshot(true);if(p===.65)await saveFrame('petal-ending-old-p065');}
  for(const p of [.85,.92,.97]){engine.setParams({trail:0,ambient:0});await progress(p);report.mainOnly[p]={old:(await snapshot()).summary};}engine.setParams(PARAMS);
  const oldEffects=await effectSamples();
  status('顺序销毁旧引擎，检查新版前段逐像素不变…');phase='new';await makeEngine(ParticleEngine);
  check('同一stage只保留一个实际画布',$('#stage').querySelectorAll('canvas').length===1);
  check('固定主体点与1080p输出',engine.state.actualCount===180000&&engine.canvas.width===1920&&engine.canvas.height===1080);
  for(const p of EARLY){await progress(p);const current=await snapshot(true),old=baselineEarly[p];const diff=difference(old.data,current.data);report.early[p]={old:old.summary,new:current.summary,difference:diff};check('p='+p+' 前段整个画布严格保持',current.summary.hash===old.summary.hash,diff);baselineEarly[p].data=null;if(p===.65)await saveFrame('petal-ending-new-p065');}
  engine.setParams(PARAMS);
  for(const p of LATE){status('保存末段 p='+p+' 的真实截图…');await progress(p);const frame=(await snapshot()).summary;report.late[p]=frame;await saveFrame('petal-ending-p'+String(p).replace('.',''));if(p===1)check('末段淡出到完全黑色，无泛光残留',frame.nonblack===0&&frame.meanLuma===0);else check('p='+p+' 末段仍有实际粒子碎点',frame.nonblack>0,frame);}
  engine.setParams({trail:0,ambient:0});for(const p of [.85,.92,.97]){await progress(p);const current=(await snapshot()).summary;report.mainOnly[p].new=current;check('关闭尾层与外围后 p='+p+' 主体碎点仍可见',current.nonblack>0,{old:report.mainOnly[p].old,new:current});await saveFrame('petal-ending-main-p'+String(p).replace('.',''));}engine.setParams(PARAMS);
  status('检查末段定位、暂停、逆向还原及旧六种效果…');engine.seekTimeline(17);const first=(await snapshot()).summary;engine.seekTimeline(3);engine.seekTimeline(20);engine.seekTimeline(17);const repeat=(await snapshot()).summary;check('末段同秒定位不依赖历史',first.hash===repeat.hash,{first:first.hash,repeat:repeat.hash});
  const time=engine.state.time;await wait(400);const paused=(await snapshot()).summary;check('末段暂停冻结粒子和尾层',repeat.hash===paused.hash&&engine.state.time===time);
  await progress(.97);await snapshot();await progress(0);const restored=(await snapshot()).summary;check('反向回0精确还原且无尾层残留',restored.hash===report.early[0].new.hash&&!engine.trails.visible&&!engine.particleTrails.visible,{restored:restored.hash,baseline:report.early[0].new.hash});
  engine.seekTimeline(0);const start=(await snapshot()).summary;engine.seekTimeline(36);const end=(await snapshot()).summary;check('36秒循环首尾仍像素一致',start.hash===end.hash);
  const newEffects=await effectSamples();report.effects={old:oldEffects,new:newEffects};for(const effect of EFFECTS)check(effect+' 原效果整幅画面未改变',oldEffects[effect].hash===newEffects[effect].hash);
  engine.setParams(PARAMS);engine.setProgress(0);engine.setEffect('erosion');await progress(.85);check('shader无错误',shaderErrors.length===0,shaderErrors);
  report.status=report.checks.every(item=>item.passed)?'static-passed':'static-failed';phase='idle';publish();
}
async function until(test,timeout=20000){const start=performance.now();while(!test()){if(performance.now()-start>timeout)throw Error('等待录制完成超时');if(recorder?.state.status==='error')throw Error(recorder.state.error);await wait(60);}}
function mediaEvent(name,action){return new Promise((resolve,reject)=>{const video=$('#video'),timer=setTimeout(()=>done(Error('播放器'+name+'超时')),15000);const success=()=>done(),failure=()=>done(Error('视频读取失败'));function done(error){clearTimeout(timer);video.removeEventListener(name,success);video.removeEventListener('error',failure);error?reject(error):resolve();}video.addEventListener(name,success,{once:true});video.addEventListener('error',failure,{once:true});try{action();}catch(error){done(error);}});}
async function decodedFrame(seconds){await mediaEvent('seeked',()=>$('#video').currentTime=seconds);const canvas=document.createElement('canvas');canvas.width=1920;canvas.height=1080;const context=canvas.getContext('2d',{willReadFrequently:true});context.drawImage($('#video'),0,0);const stats=rgbaStats(context.getImageData(0,0,1920,1080).data,1920,1080);await post('/__qa/frame',await new Promise(resolve=>canvas.toBlob(resolve,'image/png')),'image/png',{'X-Particle-Name':'petal-ending-video-'+String(seconds).replace('.','-')});canvas.width=canvas.height=1;return{seconds,...stats};}
async function recordingCheck(){
  report={startedAt:new Date().toISOString(),type:'ending-recording',status:'running',checks:[],video:{samples:[],targetFPS:30},hidden:false};phase='setup';camera=null;await makeEngine(ParticleEngine);report.environment=environment();status('从时间轴15秒录制11秒：拉丝 → 黑场 → 反向碎点…');engine.seekTimeline(15);await frames();
  recorder=new CanvasRecorder(engine.canvas,state=>{engine.setRecordingLocked(['recording','paused','processing'].includes(state.status));engine.setCaptureActive(state.status==='recording');},paused=>{if(paused){priorRunning=engine.state.running;engine.setRunning(false);}else engine.setRunning(priorRunning);});
  recorder.setProjectName('Petal_Ending');engine.setTimelinePlaying(true);recorder.start('high');check('1080p实际编码开始',recorder.state.status==='recording',{mime:recorder.mimeType});if(recorder.state.status!=='recording')throw Error(recorder.state.error||'录制未启动');phase='recording';const wall=performance.now();await until(()=>recorder.state.elapsed>=11.1,20000);recorder.stop();engine.setRunning(false);phase='processing';await until(()=>recorder.state.status==='ready');const result=recorder.state.result;
  Object.assign(report.video,{duration:result.duration,width:result.width,height:result.height,mimeType:result.mimeType,bytes:result.blob.size,filename:result.filename,captureMode:result.captureMode,requestedFrames:result.requestedFrames,wallSeconds:(performance.now()-wall)/1000});
  check('有效录像至少11秒且实际输出1080p',result.duration>=11&&result.width===1920&&result.height===1080);report.video.saved=await post('/__qa/video',result.blob,result.blob.type);const video=$('#video');video.hidden=false;await mediaEvent('loadedmetadata',()=>{video.src='/__qa/video';video.load();});check('编码视频元数据有效且能读取',video.videoWidth===1920&&video.videoHeight===1080&&video.duration>=10.5,{duration:video.duration,width:video.videoWidth,height:video.videoHeight});
  const visible=await decodedFrame(1),black=await decodedFrame(5.1),reverse=await decodedFrame(9.8);report.video.decodedFrames={ending:visible,black,reverse};check('录像末段保留实际拉丝/碎点',visible.nonblack>100);check('录像包含中间黑场（有损编码容差，最终画布另行严格全黑）',black.meanLuma<.0005&&black.lit<1920*1080*.002&&black.pink===0&&black.yellow===0,black);check('录像黑场后出现逆向聚合碎点',reverse.nonblack>100);await video.play();await wait(350);video.pause();check('录像定位后可播放暂停',video.currentTime>9.9);$('#links').replaceChildren(Object.assign(document.createElement('a'),{href:'/__qa/video',download:result.filename,textContent:'下载本次真实末段录像'}));
  report.status=report.checks.every(item=>item.passed)?'recording-passed':'recording-failed';phase='idle';publish();
}
async function guarded(task){if(busy)return;busy=true;$('#static').disabled=$('#record').disabled=true;try{await task();status(report.status+'，实际结果已保存。');}catch(error){report??={checks:[]};report.status='failed';report.error=String(error.stack||error);status('验证发现问题：'+error.message);}finally{phase='idle';engine?.setRunning(false);publish();await post('/__qa/report',JSON.stringify(report),'application/json').catch(error=>status('报告保存失败：'+error.message));busy=false;$('#static').disabled=$('#record').disabled=false;}}
$('#static').onclick=()=>guarded(staticChecks);$('#record').onclick=()=>guarded(recordingCheck);$('#stop').onclick=()=>recorder?.stop();$('#save').onclick=()=>{if(engine&&!busy)saveFrame('petal-ending-manual').then(saved=>status('已保存 '+saved.path));};document.querySelectorAll('[data-progress]').forEach(button=>button.onclick=()=>{if(engine&&!busy)progress(Number(button.dataset.progress));});
const liveTimer=setInterval(()=>{if(!engine)return;const state=engine.state;$('#live').textContent=`${phase} · ${state.timelineTime.toFixed(2)}秒 · p=${state.progress.toFixed(3)} · ${state.actualCount}主体 · ${state.filamentCount}尾层路径 · ${state.fps}渲染FPS`;if(report&&busy&&document.hidden)report.hidden=true;if(report?.video&&phase==='recording')report.video.samples.push({elapsed:recorder.state.elapsed,time:state.timelineTime,progress:state.progress,fps:state.fps,count:state.actualCount});},500);
window.addEventListener('beforeunload',()=>{clearInterval(liveTimer);dispose();});
</script></html>
